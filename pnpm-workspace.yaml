packages:
  - "apps/*"
  - "packages/*"

# bcrypt (#46) ships a native addon; allow its install script to compile it.
# pnpm blocks build scripts by default, so it must be opted in explicitly.
onlyBuiltDependencies:
  - bcrypt

# Single source of truth for shared dependency versions across the workspace.
# Pre-seeded here; the apps landing in later slices (apps/web #40, apps/api #41)
# will reference these with `catalog:` instead of hardcoding versions.
catalog:
  typescript: ^5.9.0
  "@types/node": ^24.0.0
  graphql: ^17.0.0
  react: ^19.0.0
  react-dom: ^19.0.0
  "@types/react": ^19.0.0
  "@types/react-dom": ^19.0.0
  # apps/api server stack (#45 walking skeleton). Drizzle pinned to the v1 rc —
  # forced by @pothos/plugin-drizzle; GA bump budgeted per #34.
  drizzle-orm: 1.0.0-rc.4
  drizzle-kit: 1.0.0-rc.4
  pg: ^8.22.0
  "@types/pg": ^8.15.0
  "@pothos/core": ^4.13.1
  "@pothos/plugin-drizzle": ^0.17.5
  "@pothos/plugin-scope-auth": ^4.1.7
  "@pothos/plugin-zod": ^4.3.1
  graphql-yoga: ^5.21.2
  "@electric-sql/pglite": ^0.5.4
  # auth spine (#46): JWT sessions, bcrypt hashing, zod input validation
  jsonwebtoken: ^9.0.3
  "@types/jsonwebtoken": ^9.0.10
  bcrypt: ^6.0.0
  "@types/bcrypt": ^6.0.0
  zod: ^4.4.3
  # password reset (#49): transactional email behind a stubbable Mailer seam
  nodemailer: ^9.0.3
  "@types/nodemailer": ^8.0.1
  vitest: ^4.1.10
  "@vitest/coverage-v8": ^4.1.10
  tsx: ^4.23.1
  # apps/web styling stack (#66/#81): Tailwind v4 (CSS-first, no JS config) via
  # its PostCSS plugin, plus the class-authoring helpers cn() is built from
  # (clsx + tailwind-merge) and cva for variant sets in later slices.
  tailwindcss: ^4.1.16
  "@tailwindcss/postcss": ^4.1.16
  postcss: ^8.5.6
  clsx: ^2.1.1
  tailwind-merge: ^3.3.1
  class-variance-authority: ^0.7.1
  # shadcn/ui primitive kit (#66/#83): the unified Radix package the v4
  # primitives import from, their icon set, and the CSS-only animation
  # utilities (animate-in/out) the overlay primitives use. Live in @wear/ui,
  # except tw-animate-css which apps/web @imports into its stylesheet.
  radix-ui: ^1.6.7
  lucide-react: ^1.27.0
  tw-animate-css: ^1.4.0
