enum Category {
  BLAZER
  BLOUSE
  DRESS
  JACKET
  SHIRT
  SWEATSHIRT
  TROUSERS
  TSHIRT
}

input ChangePasswordInput {
  password: String!
  token: String!
}

scalar DateTime

enum Gender {
  MAN
  WOMAN
}

type Item {
  category: Category!
  createdAt: DateTime!
  createdBy: User
  description: String
  gender: Gender!
  id: ID!
  imageUrl: String!
  name: String!
  price: Float!
  sizes: [Size!]
  updatedAt: DateTime!
}

type ItemsAndCount {
  count: Int!
  maxPrice: Float
  select: [Item!]
}

input LoginInput {
  email: String!
  password: String!
}

type Mutation {
  changePassword(input: ChangePasswordInput!): SuccessMessage!
  login(input: LoginInput!): User!
  register(input: RegisterInput!): User!
  resetPassword(input: ResetPasswordInput!): SuccessMessage!
  signout: SuccessMessage!
}

type Query {
  item(id: ID!): Item
  items(where: SearchItemInput): ItemsAndCount!
  me: User
}

input RegisterInput {
  email: String!
  password: String!
}

input ResetPasswordInput {
  email: String!
}

input SearchItemInput {
  available: Boolean
  category: Category
  gender: Gender
  id: ID
  name: String
  priceFrom: Float
  priceTo: Float
  skip: Int
  sortBy: String
  sortOrder: SortOrder
  take: Int
}

type Size {
  quantity: Int!
  sizeSymbol: SizeSymbol!
}

enum SizeSymbol {
  L
  M
  S
  XL
  XS
  XXL
}

enum SortOrder {
  ASC
  DESC
}

type SuccessMessage {
  message: String!
}

type User {
  createdAt: DateTime!
  email: String!
  firstName: String
  id: ID!
  lastName: String
  phoneNumber: String
  role: UserRole!
  updatedAt: DateTime!
}

enum UserRole {
  ADMIN
  CUSTOMER
  EMPLOYEE
}
